services:
  postgres:
    image: postgres:16-alpine
    container_name: threaddesk-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-threaddesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-threaddesk_dev}
      POSTGRES_DB: ${DB_NAME:-threaddesk}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-threaddesk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: threaddesk-redis
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5